
<!DOCTYPE html>
<!-- 
    File: contact.html
    Page: Contact / Send Message
    Author: Emmanuel
    Description: Contact form using Formspree that sends messages to eckbenemzy999@gmail.com
    Last Updated: July 2026
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Emmanuel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .heading-font {
            font-family: 'Playfair Display', sans-serif;
        }
    </style>
</head>
<body class="bg-zinc-50 min-h-screen flex items-center justify-center py-12">
    <div class="max-w-2xl w-full mx-auto px-6">
        <!-- Back Button -->
        <a href="index.html" 
           class="inline-flex items-center gap-2 text-zinc-500 hover:text-zinc-700 mb-8 transition-colors">
            <i class="fa-solid fa-arrow-left"></i>
            <span class="font-medium">Back to Home</span>
        </a>

        <div class="bg-white rounded-3xl shadow-xl p-10 md:p-16">
            <div class="text-center mb-12">
                <div class="w-20 h-20 mx-auto bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mb-6">
                    <i class="fa-solid fa-envelope text-4xl"></i>
                </div>
                <h1 class="text-5xl font-bold heading-font text-zinc-900 mb-4">Send Me a Message</h1>
                <p class="text-zinc-600 text-lg">
                    I'm excited to hear from you! Fill out the form below and I'll get back to you soon.
                </p>
            </div>

            <!-- Formspree Form -->
            <form action="https://formspree.io/f/xlgqelav" 
                  method="POST"
                  class="space-y-8">

                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-zinc-700 mb-2">Your Name <span class="text-red-500">*</span></label>
                        <input type="text" name="name" 
                               class="w-full px-6 py-4 bg-zinc-50 border border-zinc-200 rounded-2xl focus:outline-none focus:border-blue-500 transition-colors"
                               placeholder="John Doe" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-700 mb-2">Your Email <span class="text-red-500">*</span></label>
                        <input type="email" name="email" 
                               class="w-full px-6 py-4 bg-zinc-50 border border-zinc-200 rounded-2xl focus:outline-none focus:border-blue-500 transition-colors"
                               placeholder="you@example.com" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-2">Phone Number</label>
                    <input type="tel" name="phone" value="+2348102915338"
                           class="w-full px-6 py-4 bg-zinc-50 border border-zinc-200 rounded-2xl focus:outline-none focus:border-blue-500 transition-colors"
                           placeholder="+234 810 291 5338">
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-2">Subject <span class="text-red-500">*</span></label>
                    <input type="text" name="subject" 
                           class="w-full px-6 py-4 bg-zinc-50 border border-zinc-200 rounded-2xl focus:outline-none focus:border-blue-500 transition-colors"
                           placeholder="Project Inquiry, Collaboration, etc." required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-2">Your Message <span class="text-red-500">*</span></label>
                    <textarea name="message" rows="8" required
                              class="w-full px-6 py-4 bg-zinc-50 border border-zinc-200 rounded-3xl focus:outline-none focus:border-blue-500 transition-colors resize-y"
                              placeholder="Hi Emmanuel, I wanted to reach out because..."></textarea>
                </div>

                <!-- Formspree hidden fields -->
                <input type="hidden" name="_subject" value="New Message from Website">
                <input type="hidden" name="_next" value="https://yourwebsite.com/thank-you.html"> 
                <input type="hidden" name="_captcha" value="false">

                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-5 rounded-2xl transition-all flex items-center justify-center gap-3 text-lg">
                    <i class="fa-solid fa-paper-plane"></i>
                    Send Message
                </button>
            </form>

            <div class="mt-10 text-center border-t pt-8">
                <p class="text-sm text-zinc-500">You can also reach me directly at:</p>
                <a href="mailto:eckbenemzy999@gmail.com" 
                   class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-700 mt-2 font-medium">
                    <i class="fa-solid fa-envelope"></i>
                    eckbenemzy999@gmail.com
                </a>
            </div>
        </div>

        <footer class="text-center text-zinc-400 text-sm mt-12">
            © Emmanuel • +234 810 291 5338
        </footer>
    </div>
</body>
</html>
