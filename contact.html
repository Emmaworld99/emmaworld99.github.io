<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form | Emmanuel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            background: linear-gradient(135deg, #1e1e2f, #3a3a5c);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Navigation */
        header {
            background: rgba(30, 30, 47, 0.95);
            padding: 15px 40px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
            transition: 0.3s;
        }
        .nav-links a:hover { color: #00d4ff; }
        .nav-links a.active { color: #00d4ff; font-weight: bold; }

        /* Form Container */
        .form-container {
            background: #fff;
            max-width: 600px;
            width: 100%;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-top: 80px;
            animation: slideUp 0.8s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-header h1 {
            color: #1e1e2f;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .form-header h1 span { color: #00d4ff; }
        .form-header p {
            color: #666;
            font-size: 1rem;
        }

        /* Form Styles */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #1e1e2f;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .form-group label .required {
            color: #ff4757;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: 0.3s;
            background: #f9f9f9;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00d4ff;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
        }
        .form-group textarea {
            height: 140px;
            resize: vertical;
            min-height: 100px;
        }

        .form-group input.error,
        .form-group textarea.error,
        .form-group select.error {
            border-color: #ff4757;
            background: #fff5f5;
        }

        .error-message {
            color: #ff4757;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff, #1e1e2f);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,212,255,0.3);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Status Messages */
        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        /* Form Footer */
        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 0.85rem;
        }
        .form-footer a {
            color: #00d4ff;
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .nav-links { gap: 15px; font-size: 0.9rem; }
            .form-container { padding: 25px; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <header>
        <nav>
            <a href="index.html" class="logo">Emmanuel</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Form Container -->
    <div class="form-container">
        <div class="form-header">
            <h1>Get In <span>Touch</span></h1>
            <p>Send me a message and I'll get back to you as soon as possible!</p>
        </div>

        <!-- 
            ✅ FORM SUBMITS TO FORMSPREE
            action="https://formspree.io/f/xlgqelav"
            method="POST"
        -->
        <form 
            action="https://formspree.io/f/xlgqelav" 
            method="POST" 
            id="contactForm">

            <div class="form-row">
                <div class="form-group">
                    <label for="name">Full Name <span class="required">*</span></label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="Your full name" 
                        required>
                    <div class="error-message" id="nameError">Please enter your name</div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="your.email@example.com" 
                        required>
                    <div class="error-message" id="emailError">Please enter a valid email</div>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    placeholder="+234 810 291 5338">
            </div>

            <div class="form-group">
                <label for="subject">Subject <span class="required">*</span></label>
                <select id="subject" name="subject" required>
                    <option value="">Select a topic</option>
                    <option value="General Inquiry">General Inquiry</option>
                    <option value="Project Collaboration">Project Collaboration</option>
                    <option value="Job Opportunity">Job Opportunity</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Feedback">Feedback</option>
                    <option value="Other">Other</option>
                </select>
                <div class="error-message" id="subjectError">Please select a subject</div>
            </div>

            <div class="form-group">
                <label for="message">Your Message <span class="required">*</span></label>
                <textarea 
                    id="message" 
                    name="message" 
                    placeholder="Write your message here..." 
                    required></textarea>
                <div class="error-message" id="messageError">Please enter your message</div>
            </div>

            <!-- Honeypot spam protection (hidden field) -->
            <input type="text" name="_gotcha" style="display:none">

            <!-- Custom subject for the email you receive -->
            <input type="hidden" name="_subject" value="New message from your website!">

            <!-- Redirect URL after submission (optional) -->
            <!-- <input type="hidden" name="_next" value="https://yourwebsite.com/thanks.html"> -->

            <button type="submit" class="submit-btn" id="submitBtn">
                Send Message 🚀
            </button>

            <div class="status-message" id="statusMessage"></div>

            <p class="form-footer">
                Your information is safe and will never be shared. 🔒
            </p>
        </form>
    </div>

    <script>
        // Form validation and submission
        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Reset previous errors
            clearErrors();

            // Get form values
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value.trim();

            // Validate fields
            let isValid = true;

            if (!name) {
                showError('name', 'nameError');
                isValid = false;
            }

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailPattern.test(email)) {
                showError('email', 'emailError');
                isValid = false;
            }

            if (!subject) {
                showError('subject', 'subjectError');
                isValid = false;
            }

            if (!message) {
                showError('message', 'messageError');
                isValid = false;
            }

            if (!isValid) return;

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending... ⏳';

            try {
                // Submit form to Formspree
                const formData = new FormData(form);
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    // Success
                    statusMessage.className = 'status-message success';
                    statusMessage.innerHTML = '✅ Thank you, ' + name + '! Your message has been sent successfully. I\'ll get back to you soon!';
                    form.reset();
                } else {
                    // Error from Formspree
                    const data = await response.json();
                    if (data.errors) {
                        statusMessage.className = 'status-message error';
                        statusMessage.innerHTML = '❌ ' + (data.errors[0].message || 'Something went wrong. Please try again.');
                    } else {
                        throw new Error('Form submission failed');
                    }
                }
            } catch (error) {
                // Network or other error - fall back to native submission
                statusMessage.className = 'status-message success';
                statusMessage.innerHTML = '✅ Submitting your message...';
                
                // Fall back to native form submission
                setTimeout(() => {
                    form.submit();
                }, 1000);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Message 🚀';

                // Hide status message after 6 seconds
                setTimeout(() => {
                    statusMessage.className = 'status-message';
                    statusMessage.innerHTML = '';
                }, 6000);
            }
        });

        function showError(fieldId, errorId) {
            document.getElementById(fieldId).classList.add('error');
            document.getElementById(errorId).classList.add('show');
        }

        function clearErrors() {
            document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            statusMessage.className = 'status-message';
            statusMessage.innerHTML = '';
        }

        // Real-time validation - remove error on input
        ['name', 'email', 'subject', 'message'].forEach(id => {
            const field = document.getElementById(id);
            field.addEventListener('input', () => {
                field.classList.remove('error');
                const errorEl = field.parentElement.querySelector('.error-message');
                if (errorEl) errorEl.classList.remove('show');
            });
        });
    </script>

</body>
</html>
