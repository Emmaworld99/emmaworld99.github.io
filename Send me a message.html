<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Me a Message - Emmanuel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .heading-font {
            font-family: 'Playfair Display', sans-serif;
        }
    </style>
</head>
<body class="bg-zinc-50 min-h-screen flex items-center justify-center py-12">
    <div class="max-w-2xl w-full mx-auto px-6">
        <!-- Back Button -->
        <a href="index.html" 
           class="inline-flex items-center gap-2 text-zinc-500 hover:text-zinc-700 mb-8 transition-colors">
            <i class="fa-solid fa-arrow-left"></i>
            <span class="font-medium">Back to Home</span>
        </a>

        <div class="bg-white rounded-3xl shadow-xl p-10 md:p-16">
            <div class="text-center mb-12">
                <div class="w-20 h-20 mx-auto bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mb-6">
                    <i class="fa-solid fa-envelope text-4xl"></i>
                </div>
                <h1 class="text-5xl font-bold heading-font text-zinc-900 mb-4">Send Me a Message</h1>
                <p class="text-zinc-600 text-lg">
                    I'd love to hear from you! Whether you have a project in mind, 
                    want to collaborate, or just say hello.
                </p>
            </div>

            <!-- Contact Form -->
            <form id="contactForm" class="space-y-8">
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-zinc-700 mb-2">Your Name</label>
                        <input type="text" id="name" 
                               class="w-full px-6 py-4 bg-zinc-50 border border-zinc-200 rounded-2xl focus:outline-none focus:border-blue-500 transition-colors"
                               placeholder="John Doe" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-700 mb-2">Your Email</label>
                        <input type="email" id="email" 
                               class="w-full px-6 py-4 bg-zinc-50 border border-zinc-200 rounded-2xl focus:outline-none focus:border-blue-500 transition-colors"
                               placeholder="you@example.com" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-2">Subject</label>
                    <input type="text" id="subject" 
                           class="w-full px-6 py-4 bg-zinc-50 border border-zinc-200 rounded-2xl focus:outline-none focus:border-blue-500 transition-colors"
                           placeholder="Project Collaboration / Inquiry / Hello" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-2">Message</label>
                    <textarea id="message" rows="8"
                              class="w-full px-6 py-4 bg-zinc-50 border border-zinc-200 rounded-3xl focus:outline-none focus:border-blue-500 transition-colors resize-y"
                              placeholder="Hi Emmanuel, I wanted to reach out because..."></textarea>
                </div>

                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-5 rounded-2xl transition-all flex items-center justify-center gap-3 text-lg">
                    <i class="fa-solid fa-paper-plane"></i>
                    Send Message
                </button>
            </form>

            <!-- Direct Email -->
            <div class="mt-10 text-center">
                <p class="text-sm text-zinc-500 mb-3">Or email me directly:</p>
                <a href="mailto:eckbenemzy999@gmail.com" 
                   class="inline-flex items-center gap-3 text-blue-600 hover:text-blue-700 font-medium transition-colors">
                    <i class="fa-solid fa-envelope"></i>
                    <span class="underline">eckbenemzy999@gmail.com</span>
                </a>
            </div>
        </div>

        <footer class="text-center text-zinc-400 text-sm mt-12">
            © Emmanuel • Let's build something great together
        </footer>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value || "Message from Website";
            const message = document.getElementById('message').value;

            // Create mailto link with pre-filled content
            const mailtoLink = `mailto:eckbenemzy999@gmail.com?subject=\( {encodeURIComponent(subject)}&body= \){encodeURIComponent(
                `Name: ${name}\nEmail: \( {email}\n\nMessage:\n \){message}`
            )}`;

            // Open the user's email client
            window.location.href = mailtoLink;

            // Optional: Show success message
            alert("Your email client has been opened with the message details. Thank you for reaching out!");
        });
    </script>
</body>
  </html>
